  <rect width="1120" height="460" rx="18" fill="url(#bg)" stroke="#2E2254" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="bold">

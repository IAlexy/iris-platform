  <g fill="#1D1636" stroke="#10B981" stroke-width="1">
    <rect x="866" y="132" width="64" height="64" rx="5"/><rect x="938" y="132" width="64" height="64" rx="5"/><rect x="1010" y="132" width="64" height="64" rx="5"/>
    <rect x="866" y="204" width="64" height="64" rx="5"/><rect x="938" y="204" width="64" height="64" rx="5"/><rect x="1010" y="204" width="64" height="64" rx="5"/>
  </g>

  <!-- Lightbox Callout Box -->
  <rect x="866" y="284" width="208" height="132" rx="8" fill="#0A0812" stroke="#A855F7" stroke-width="1.5"/>
  <text x="970" y="308" text-anchor="middle" fill="#A855F7" font-family="sans-serif" font-size="11.5" font-weight="bold">

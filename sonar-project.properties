# =====================================================================
# SonarQube / SonarCloud Configuration for Iris Platform
# =====================================================================

sonar.projectKey=iris-platform
sonar.projectName=Iris - Plateforme de Cercles Visuels Privés (Azure .NET, Desktop Web & Mobile)
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Project base directory
sonar.projectBaseDir=.

# Sources & Modules
sonar.sources=backend/Iris.Domain,backend/Iris.Application,backend/Iris.Infrastructure,backend/Iris.Api,web/src,mobile/src
sonar.tests=backend/Iris.Tests,web/src/test,mobile/src/test,web/e2e

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,web/vite.config.ts,web/vitest.config.ts,web/playwright.config.ts,mobile/metro.config.js,**/test-results/**
sonar.test.inclusions=**/*.Tests/**/*.cs,web/src/test/**/*,mobile/src/test/**/*,web/e2e/**/*

# Code Coverage Reports
sonar.cs.opencover.reportsPaths=backend/**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,mobile/coverage/lcov.info
